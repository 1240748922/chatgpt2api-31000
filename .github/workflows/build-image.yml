name: Build and publish container image

on:
  push:
    branches: [main, "codex/ready-pool-prewarm"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/1240748922/chatgpt2api-31000

jobs:
  coordination-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: credential_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d credential_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest sqlalchemy psycopg2-binary
      - name: Verify real PostgreSQL credential interleavings
        env:
          PYTHONPATH: src_extract
          TEST_POSTGRES_URL: postgresql+psycopg2://test:disposable-test-only@localhost:5432/credential_test
        run: python -m pytest src_extract/tests/test_credential_coordinator_postgres.py -q --tb=short

  build-and-publish:
    needs: coordination-regression
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
