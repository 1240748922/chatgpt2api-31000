name: chatgpt2api-31000

x-app: &app
  # Use the application revision selected by this checkout; .env can pin another version.
  image: ghcr.io/1240748922/chatgpt2api-31000:${CHATGPT2API_IMAGE_TAG:-sha-c49a76d}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:80/version', timeout=3).status == 200"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s
  volumes:
    # The application resolves DATA_DIR and CONFIG_FILE relative to
    # /app/src_extract, so these mounts must target the paths it actually uses.
    - "${CHATGPT2API_DATA_DIR:-./data}:/app/src_extract/data"
    - "${CHATGPT2API_CONFIG_FILE:-./config.json}:/app/src_extract/config.json"
    - "${REGISTER_TOOL_CONFIG_FILE:-./GPT-Register-Tool-main/config.json}:/app/GPT-Register-Tool-main/config.json"
    - "${REGISTER_TOOL_SESSIONS_DIR:-./GPT-Register-Tool-main/sessions}:/app/GPT-Register-Tool-main/sessions"
    - "${REGISTER_TOOL_RUNTIME_DIR:-./GPT-Register-Tool-main/runtime}:/app/GPT-Register-Tool-main/runtime"
  networks: [frontend, database]
  environment: &env
    DATABASE_URL: postgresql://${POSTGRES_USER:-chatgpt2api}:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/${POSTGRES_DB:-chatgpt2api}
    # Eight replicas share one PostgreSQL instance. Keep the aggregate pool
    # below PostgreSQL's default max_connections and leave headroom for
    # dashboard, health-check, and maintenance sessions.
    DATABASE_POOL_SIZE: 4
    DATABASE_MAX_OVERFLOW: 4
    DATABASE_POOL_TIMEOUT_SECONDS: 10
    CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-change-me}
    # /version exposes these values so a deployment can be verified without
    # guessing from the source checkout or the Docker image cache.
    CHATGPT2API_IMAGE_TAG: ${CHATGPT2API_IMAGE_TAG:-sha-c49a76d}
    CHATGPT2API_BUILD_VERSION: ${CHATGPT2API_BUILD_VERSION:-${CHATGPT2API_IMAGE_TAG:-sha-c49a76d}}
    CHATGPT2API_BUILD_TIME: ${CHATGPT2API_BUILD_TIME:-unknown}
    CHATGPT2API_THREAD_TOKENS: 160
    CHATGPT2API_IMAGE_THREAD_TOKENS: 140
    # Optional overlap workers, NOT an image request limit; full/0 uses serial upload.
    CHATGPT2API_IMAGE_PREWARM_CONCURRENCY: ${CHATGPT2API_IMAGE_PREWARM_CONCURRENCY:-64}
    # Strict admission + single-send RT coordination. 0 is a cluster-wide rollback only.
    CHATGPT2API_STRICT_IMAGE_CREDENTIALS: ${CHATGPT2API_STRICT_IMAGE_CREDENTIALS:-1}
    # Page context inventory PER replica; fill workers/rate are CLUSTER totals.
    CHATGPT2API_PAGE_PREWARM_TARGET: ${CHATGPT2API_PAGE_PREWARM_TARGET:-16}
    CHATGPT2API_PAGE_PREWARM_TTL_SECONDS: ${CHATGPT2API_PAGE_PREWARM_TTL_SECONDS:-45}
    CHATGPT2API_PAGE_PREWARM_WORKERS: ${CHATGPT2API_PAGE_PREWARM_WORKERS:-8}
    CHATGPT2API_PAGE_PREWARM_RATE: ${CHATGPT2API_PAGE_PREWARM_RATE:-8}
    CHATGPT2API_MAINTENANCE_IMPORTER_URL: http://importer:80
    CHATGPT2API_IMAGE_QUEUE_LIMIT: 40
    CHATGPT2API_IMAGE_RETRY_AFTER_SECS: 2
    # Only extend a busy ready pool; empty/expired pools keep the short probe.
    CHATGPT2API_IMAGE_BUSY_WAIT_SECONDS: ${CHATGPT2API_IMAGE_BUSY_WAIT_SECONDS:-30}
    # Super-resolution is independent from image generation slots. Keep eight
    # CPU jobs per replica so normal image traffic does not queue behind four
    # post-processing jobs; tune down through .env if CPU saturation appears.
    CHATGPT2API_IMAGE_UPSCALE_CONCURRENCY: ${CHATGPT2API_IMAGE_UPSCALE_CONCURRENCY:-64}
    CHATGPT2API_FSRCNN_CONCURRENCY: ${CHATGPT2API_FSRCNN_CONCURRENCY:-64}
    CHATGPT2API_FSRCNN_THREADS: ${CHATGPT2API_FSRCNN_THREADS:-1}
    CHATGPT2API_UPLOAD_COOLDOWN_SECONDS: ${CHATGPT2API_UPLOAD_COOLDOWN_SECONDS:-900}
    CHATGPT2API_UPLOAD_COOLDOWN_MAX_SECONDS: ${CHATGPT2API_UPLOAD_COOLDOWN_MAX_SECONDS:-7200}
    CHATGPT2API_MAINTENANCE_BATCH_CONCURRENCY: ${CHATGPT2API_MAINTENANCE_BATCH_CONCURRENCY:-2}
    # Account sync/renewal adapts to performance, not active image count.
    # Set idle only for rollback to the previous low-concurrency policy.
    CHATGPT2API_ACCOUNT_MAINTENANCE_POLICY: ${CHATGPT2API_ACCOUNT_MAINTENANCE_POLICY:-performance}
    CHATGPT2API_MAINTENANCE_DB_P95_MS: ${CHATGPT2API_MAINTENANCE_DB_P95_MS:-500}
    CHATGPT2API_MAINTENANCE_WRITE_WAIT_P95_MS: ${CHATGPT2API_MAINTENANCE_WRITE_WAIT_P95_MS:-500}
    CHATGPT2API_MAINTENANCE_QUEUE_P95_MS: ${CHATGPT2API_MAINTENANCE_QUEUE_P95_MS:-1000}
    CHATGPT2API_MAINTENANCE_UPSTREAM_P95_MS: ${CHATGPT2API_MAINTENANCE_UPSTREAM_P95_MS:-10000}
    CHATGPT2API_UNKNOWN_QUOTA_SYNC_BATCH_SIZE: ${CHATGPT2API_UNKNOWN_QUOTA_SYNC_BATCH_SIZE:-50}
    CHATGPT2API_ACCOUNT_SHARD_COUNT: 8
    # Account ingestion runs in the dedicated importer service below so that
    # large imports never consume the public app's maintenance worker.
    CHATGPT2API_IMPORT_WORKER_ENABLED: 0
    CHATGPT2API_IMPORT_BATCH_SIZE: ${CHATGPT2API_IMPORT_BATCH_SIZE:-250}
    # Registration, retention and backups keep the old low-load gate.
    # These values do not change the image worker-pool concurrency.
    CHATGPT2API_MAINTENANCE_IMAGE_ACTIVE_MAX: ${CHATGPT2API_MAINTENANCE_IMAGE_ACTIVE_MAX:-2}
    CHATGPT2API_MAINTENANCE_IMAGE_WAITING_MAX: ${CHATGPT2API_MAINTENANCE_IMAGE_WAITING_MAX:-0}
    CHATGPT2API_MAINTENANCE_RETRY_SECONDS: ${CHATGPT2API_MAINTENANCE_RETRY_SECONDS:-30}
    # Only healthy account-maintenance backlog uses this short continuation;
    # idle/pressure retries and full-pool discovery keep the original interval.
    CHATGPT2API_MAINTENANCE_CONTINUE_SECONDS: ${CHATGPT2API_MAINTENANCE_CONTINUE_SECONDS:-2}
    CHATGPT2API_MONITOR_CLUSTER_SECRET: ${CHATGPT2API_MONITOR_CLUSTER_SECRET:-change-this-cluster-secret}
    MALLOC_ARENA_MAX: 2
    TZ: Asia/Shanghai

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatgpt2api}
      POSTGRES_USER: ${POSTGRES_USER:-chatgpt2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [database]

  app0: {<<: *app, environment: {<<: *env, CHATGPT2API_ACCOUNT_SHARD_INDEX: 0}}
  app1: {<<: *app, environment: {<<: *env, CHATGPT2API_ACCOUNT_SHARD_INDEX: 1}}
  app2: {<<: *app, environment: {<<: *env, CHATGPT2API_ACCOUNT_SHARD_INDEX: 2}}
  app3: {<<: *app, environment: {<<: *env, CHATGPT2API_ACCOUNT_SHARD_INDEX: 3}}
  app4: {<<: *app, environment: {<<: *env, CHATGPT2API_ACCOUNT_SHARD_INDEX: 4}}
  app5: {<<: *app, environment: {<<: *env, CHATGPT2API_ACCOUNT_SHARD_INDEX: 5}}
  app6: {<<: *app, environment: {<<: *env, CHATGPT2API_ACCOUNT_SHARD_INDEX: 6}}
  app7: {<<: *app, environment: {<<: *env, CHATGPT2API_ACCOUNT_SHARD_INDEX: 7}}

  importer:
    <<: *app
    command:
      - /app/.venv/bin/python
      - -m
      - uvicorn
      - import_main:app
      - --app-dir
      - /app/src_extract
      - --host
      - 0.0.0.0
      - --port
      - "80"
    environment:
      <<: *env
      CHATGPT2API_IMPORT_WORKER_ENABLED: 1
    # The importer exposes only the authenticated import API and its own
    # health/version endpoint; it has no image-generation routes.

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["31000:80"]
    # Docker DNS aliases can appear a moment after the app containers are
    # started. Wait for every app health endpoint before parsing nginx.conf.
    command:
      - /bin/sh
      - -c
      - |
        for app in app0 app1 app2 app3 app4 app5 app6 app7 importer; do
          until wget -q -O /dev/null "http://$${app}/version"; do
            sleep 1
          done
        done
        exec nginx -g "daemon off;"
    volumes:
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      # Images are generated by any app replica. The gateway reads the same
      # host directory so image delivery never depends on replica selection.
      - "${CHATGPT2API_DATA_DIR:-./data}:/app/src_extract/data:ro"
    networks: [frontend]
    depends_on:
      app0: {condition: service_healthy}
      app1: {condition: service_healthy}
      app2: {condition: service_healthy}
      app3: {condition: service_healthy}
      app4: {condition: service_healthy}
      app5: {condition: service_healthy}
      app6: {condition: service_healthy}
      app7: {condition: service_healthy}
      importer: {condition: service_healthy}

networks:
  frontend:
  database:

volumes:
  postgres-data:
