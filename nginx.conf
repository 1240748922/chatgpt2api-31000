resolver 127.0.0.11 valid=10s ipv6=off;
upstream chatgpt2api_pool {
  zone chatgpt2api_pool 128k;
  least_conn;
  server app0:80 resolve max_fails=2 fail_timeout=10s;
  server app1:80 resolve max_fails=2 fail_timeout=10s;
  server app2:80 resolve max_fails=2 fail_timeout=10s;
  server app3:80 resolve max_fails=2 fail_timeout=10s;
  server app4:80 resolve max_fails=2 fail_timeout=10s;
  server app5:80 resolve max_fails=2 fail_timeout=10s;
  server app6:80 resolve max_fails=2 fail_timeout=10s;
  server app7:80 resolve max_fails=2 fail_timeout=10s;
  keepalive 256;
}
server {
  listen 80;
  client_max_body_size 100m;
  proxy_connect_timeout 10s;
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;
  location ^~ /internal/ { return 404; }
  location /api/ { proxy_buffering off; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_pass http://app0:80; }
  location /v1/image-tasks { proxy_pass http://app0:80; }
  location / { proxy_buffering off; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_pass http://chatgpt2api_pool; }
}
