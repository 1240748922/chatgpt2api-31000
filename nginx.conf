resolver 127.0.0.11 valid=10s ipv6=off;
upstream chatgpt2api_pool {
  zone chatgpt2api_pool 128k;
  least_conn;
  server app0:80 resolve max_fails=2 fail_timeout=10s;
  server app1:80 resolve max_fails=2 fail_timeout=10s;
  server app2:80 resolve max_fails=2 fail_timeout=10s;
  server app3:80 resolve max_fails=2 fail_timeout=10s;
  server app4:80 resolve max_fails=2 fail_timeout=10s;
  server app5:80 resolve max_fails=2 fail_timeout=10s;
  server app6:80 resolve max_fails=2 fail_timeout=10s;
  server app7:80 resolve max_fails=2 fail_timeout=10s;
  keepalive 256;
}
server {
  listen 80;
  client_max_body_size 100m;
  proxy_connect_timeout 10s;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  location ^~ /internal/ { return 404; }
  # Serve local assets from the shared host-mounted data directory. This
  # removes image delivery from the least_conn pool. The named fallback keeps
  # WebDAV-only assets and older deployments working through app0.
  location ^~ /images/ {
    root /app/src_extract/data;
    try_files $uri @image_backend;
  }
  location ^~ /image-thumbnails/ {
    alias /app/src_extract/data/image_thumbnails/;
    # Thumbnail files are stored as <image-relative-path>.png while the
    # public URL contains only the original image-relative path.
    try_files $uri.png @image_backend;
  }
  location @image_backend {
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_pass http://app0:80;
  }
  # Large account imports use a dedicated process and worker. Keep this route
  # ahead of the general /api/ proxy so import traffic cannot land on app0.
  location ^~ /api/account-import-jobs {
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_pass http://importer:80;
  }
  location = /account-import.html {
    proxy_set_header Host $http_host;
    proxy_pass http://importer:80;
  }
  location /api/ { proxy_buffering off; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $http_host; proxy_pass http://app0:80; }
  location /v1/image-tasks { proxy_set_header Host $http_host; proxy_pass http://app0:80; }
  location / { proxy_buffering off; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $http_host; proxy_pass http://chatgpt2api_pool; }
}
